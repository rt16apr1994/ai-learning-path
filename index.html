<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Learning Path Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">Personalized Learning Path</h1>
        
        <div class="space-y-4">
            <input id="apiKey" type="password" placeholder="Enter Gemini API Key" class="w-full p-2 border rounded">
            <select id="language" class="w-full p-2 border rounded">
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Spanish">Spanish</option>
            </select>
            <input id="subject" type="text" placeholder="Subject (e.g., Computer Science)" class="w-full p-2 border rounded">
            <input id="topic" type="text" placeholder="Specific Topic (e.g., Python Loops)" class="w-full p-2 border rounded">
            
            <button onclick="generatePath()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
                Generate My Path
            </button>
        </div>

        <div id="output" class="mt-8 prose lg:prose-xl"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
